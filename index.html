<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Odin Sign Up Form</title>
  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <img src="./images/leaves.jpg" alt="leaves background image">
        <div class="logo">
          <img src="./images/odin-lined.png" alt="">
          <span>ODIN</span>
        </div>
        <div class="image-credit">
          Photo by 
          <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
          on
          <a href="https://unsplash.com/">Unsplash</a>
        </div>
      </div>
      <div class="right-side">
        <div class="description">
          <p class="">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
          </p>
          <p>Sign up <i>now</i> to get started.</p>
          <p>you <i>know</i> you want to.</p>
        </div>
        <div class="main">
          <form action="" class="sign-up-form">
            <div class="row-container">
              <p>Let's do this!</p>
              <div class="row-1">
                <div class="row">
                  <label for="first-name">FIRST NAME</label>
                  <input type="text" id="first-name" name="first-name" autocomplete="given-name">
                </div>
                <div class="row">
                  <label for="last-name">LAST NAME</label>
                  <input type="text" id="last-name" name="last-name" autocomplete="family-name">
                </div>
              </div>
              <div class="row-2">
                <div class="row">
                  <label for="email">EMAIL</label>
                  <input type="email" id="email" name="email" autocomplete="email">
                </div>
                <div class="row">
                  <label for="phone">PHONE NUMBER</label>
                  <input type="tel" id="phone" name="phone" autocomplete="tel">
                </div>
              </div>
              <div class="row-3">
                <div class="row">
                  <label for="password">PASSWORD</label>
                  <input type="password" id="password" name="pwd" autocomplete="new-password" maxlength="20" required>
                </div>
                <div class="row">
                  <label for="confirm">CONFIRM PASSWORD</label>
                  <input type="password" id="confirm" name="confirm" autocomplete="new-password" maxlength="20" required>
                </div>
              </div>
            </div>
            <button class="createBtn">Create Account</button>
          </form>
        </div>
        <div class="account">
          <span>Already have an account? </span>
          <a href="#">Log in</a>
        </div>
      </div>
    </div>
  </body>
</html>
